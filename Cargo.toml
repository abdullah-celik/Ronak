[workspace]
resolver = "2"
members = [
    "crates/ronak-core",
    "crates/ronak-hw",
    "crates/ronak-store",
    "crates/ronak-gnome",
    "crates/ronakd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/abdullah-celik/Ronak"
repository = "https://github.com/abdullah-celik/Ronak"
description = "Ronak: a local-first, intent-aware context layer for the desktop."

[workspace.dependencies]
# Internal crates
ronak-core = { path = "crates/ronak-core" }
ronak-hw = { path = "crates/ronak-hw" }
ronak-store = { path = "crates/ronak-store" }
ronak-gnome = { path = "crates/ronak-gnome" }

# Shared external crates
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
getrandom = "0.3"
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Test-only
jsonschema = { version = "0.61", default-features = false }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
